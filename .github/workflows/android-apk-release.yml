name: Android APK Release

on:
  push:
    tags:
      - "v*"
      - "android-v*"
    branches:
      - main
    paths:
      - "packages/app/**"
      - "packages/client/**"
      - "packages/protocol/**"
      - "packages/highlight/**"
      - "packages/plugin/**"
      - "packages/expo-two-way-audio/**"
      - "package-lock.json"
      - "scripts/prebuild-android.mjs"
      - ".github/workflows/android-apk-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: android-apk-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  ensure-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            printf 'RELEASE_TAG=android-latest\nIS_PRERELEASE=true\n' >> "$GITHUB_ENV"
          else
            node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"
          fi

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" == "android-latest" ]]; then
            git push --force origin "$GITHUB_SHA:refs/tags/android-latest"
            gh release view android-latest --repo "${{ github.repository }}" >/dev/null 2>&1 ||
              gh release create android-latest --repo "${{ github.repository }}" --prerelease \
                --title "Paseo Android (latest main)" \
                --notes "Rolling arm64 APK from main: https://github.com/${{ github.repository }}/releases/download/android-latest/paseo-android-latest.apk"
            exit 0
          fi

          if node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
            --title "Paseo $RELEASE_TAG"
            --notes ""
            --draft
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
            node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null
          fi

  publish-android-apk:
    needs: [ensure-release]
    permissions:
      contents: write
      packages: read
    runs-on: [self-hosted, linux, x64, paseo-android]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            printf 'RELEASE_TAG=android-latest\nIS_PRERELEASE=true\n' >> "$GITHUB_ENV"
          else
            node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Use guarded Android toolchain
        shell: bash
        run: |
          source /usr/local/lib/pandaos-android-queue/env.sh
          printf 'JAVA_HOME=%s\nANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' \
            "$JAVA_HOME" "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        run: pandaos-android-queue -- node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app JavaScript dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          pandaos-android-queue -- npm run build:app-deps
          node scripts/verify-app-dist.mjs

      - name: Generate Android project
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          pandaos-android-queue -- env APP_VARIANT=production node scripts/prebuild-android.mjs

      - name: Build Android APK
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cd packages/app
          cd android
          pandaos-android-queue -- env APP_VARIANT=production ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -x lint \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            -x generateReleaseLintModel \
            -x generateReleaseLintVitalModel \
            --build-cache \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            --console=plain \
            --stacktrace

      - name: Resolve APK artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          asset_name="paseo-${RELEASE_TAG}-android.apk"
          [[ "$RELEASE_TAG" == "android-latest" ]] && asset_name="paseo-android-latest.apk"
          asset_path="$RUNNER_TEMP/$asset_name"
          cp packages/app/android/app/build/outputs/apk/release/app-release.apk "$asset_path"

          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_lookup="$(node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG")"
          gh release upload "$release_lookup" "${{ steps.artifact.outputs.asset_path }}" --clobber --repo "${{ github.repository }}"
