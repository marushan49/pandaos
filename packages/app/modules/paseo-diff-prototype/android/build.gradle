apply plugin: 'com.android.library'

group = 'sh.pandaos.diffprototype'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

def skiaPackage = new File(["node", "--print", "require.resolve('@shopify/react-native-skia/package.json')"].execute(null, projectDir).text.trim()).parentFile

android {
  namespace "sh.pandaos.diffprototype"
  defaultConfig {
    ndk {
      abiFilters(*(project.findProperty("reactNativeArchitectures")?.split(",") ?: ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]))
    }
    externalNativeBuild {
      cmake {
        arguments "-DSKIA_PACKAGE=${skiaPackage.absolutePath}"
        cppFlags "-std=c++20 -O2 -fexceptions -frtti"
      }
    }
  }
  externalNativeBuild {
    cmake { path "CMakeLists.txt" }
  }
}
